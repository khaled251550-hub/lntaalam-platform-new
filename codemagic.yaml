workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      groups:
        - apple_credentials
    scripts:
      - name: Clean Install without strict corepack checks
        script: |
          cd /Users/builder/clone
          # إيقاف أي تفعيل إجباري لـ corepack لكي لا يعترض على إصدارات المدير
          corepack disable || true
          # استخدام npm مع تجاهل النصوص البرمجية الإجبارية الفاحصة (ignore-scripts)
          npm install --legacy-peer-deps --ignore-scripts
      - name: Build web assets
        script: |
          cd /Users/builder/clone
          npm run app:build
      - name: Sync Capacitor iOS
        script: |
          cd /Users/builder/clone
          npx cap sync ios
    artifacts:
      - "**/ios/App/App/build/**/*.ipa"







































