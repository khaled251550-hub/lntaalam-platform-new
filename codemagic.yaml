workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    working_directory: clone
    environment:
      node: latest
      groups:
        - apple_credentials
    scripts:
      - name: Debug and Install dependencies
        script: |
          echo "=== Checking current directory ==="
          pwd
          ls -la
          echo "=== Checking package.json content ==="
          cat package.json
          echo "=== Running npm install with verbose output ==="
          npm install --legacy-peer-deps || exit 1
      - name: Build web assets
        script: npm run app:build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
    artifacts:
      - "**/ios/App/App/build/**/*.ipa"





















