workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    working_directory: clone
    environment:
      groups:
        - apple_credentials
    scripts:
      - name: Install dependencies with Yarn
        script: yarn install --immutable --immutable-cache --check-cache || yarn install
      - name: Build web assets
        script: yarn run app:build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
    artifacts:
      - ios/App/App/build/**/*.ipa









