workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      groups:
        - apple_credentials
    scripts:
      - name: Setup Yarn and Install Dependencies
        script: |
          corepack enable
          # الانتقال إلى المجلد الذي يحتوي على package.json والتثبيت
          cd $(find . -name "package.json" -maxdepth 2 -exec dirname {} ;)
          yarn install
      - name: Build web assets
        script: |
          cd $(find . -name "package.json" -maxdepth 2 -exec dirname {} ;)
          yarn run app:build
      - name: Sync Capacitor iOS
        script: |
          cd $(find . -name "package.json" -maxdepth 2 -exec dirname {} ;)
          npx cap sync ios
    artifacts:
      - "**/ios/App/App/build/**/*.ipa"

























