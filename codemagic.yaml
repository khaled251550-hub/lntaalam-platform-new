workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      groups:
        - apple_credentials
    scripts:
      - name: Install Dependencies
        script: |
          # التأكد من الدخول إلى مجلد المشروع الصحيح أينما وجد
          cd clone || cd .
          corepack enable
          yarn install
      - name: Build web assets
        script: |
          cd clone || cd .
          yarn run app:build
      - name: Sync Capacitor iOS
        script: |
          cd clone || cd .
          npx cap sync ios
    artifacts:
      - "**/ios/App/App/build/**/*.ipa"





























