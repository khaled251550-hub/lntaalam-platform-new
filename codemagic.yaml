workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      groups:
        - apple_credentials
    scripts:
      - name: Navigate and Install dependencies
        script: |
          cd clone
          npm install --force
      - name: Build web assets
        script: |
          cd clone
          npm run app:build
      - name: Sync Capacitor iOS
        script: |
          cd clone
          npx cap sync ios
    artifacts:
      - "**/ios/App/App/build/**/*.ipa"























