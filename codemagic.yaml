workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      groups:
        - apple_credentials
    scripts:
      - name: Enable pnpm via corepack
        script: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        script: pnpm install --frozen-lockfile=false
      - name: Build web assets
        script: pnpm run app:build
      - name: Sync Capacitor iOS
        script: pnpm run mobile:sync
    artifacts:
      - ios/App/App/build/**/*.ipa
