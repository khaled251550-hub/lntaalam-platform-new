workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      groups:
        - apple_credentials
    scripts:
      - name: Fresh Setup with Correct Package Manager
        script: |
          cd /Users/builder/clone
          # تفعيل pnpm بالطريقة الرسمية التي يتوافق بها مع حقل packageManager في المشروع
          corepack enable
          corepack prepare pnpm@latest --activate
          
          # تثبيت الاعتماديات مع تجاوز القيود عبر القوة الصريحة
          pnpm install --no-frozen-lockfile
      - name: Build web assets
        script: |
          cd /Users/builder/clone
          pnpm run app:build
      - name: Sync Capacitor iOS
        script: |
          cd /Users/builder/clone
          npx cap sync ios
    artifacts:
      - "**/ios/App/App/build/**/*.ipa"








































