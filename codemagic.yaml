workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      groups:
        - apple_credentials
    scripts:
      - name: Install dependencies
        script: pnpm install
      - name: Build web assets
        script: pnpm run app:build
      - name: Sync Capacitor iOS
        script: pnpm run mobile:sync
    artifacts:
      - ios/App/App/build/**/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
