workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    working_directory: clone
    environment:
      node: latest
      groups:
        - apple_credentials
    scripts:
      - name: Install dependencies bypassing strict checks
        script: |
          corepack disable
          npm install --legacy-peer-deps
      - name: Build web assets
        script: npm run app:build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
    artifacts:
      - "**/ios/App/App/build/**/*.ipa"




















