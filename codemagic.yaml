workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      groups:
        - apple_credentials
    scripts:
      - name: Install dependencies
        script: yarn install --frozen-lockfile=false
      - name: Build web assets
        script: yarn run app:build
      - name: Sync Capacitor iOS
        script: yarn run mobile:sync
    artifacts:
      - ios/App/App/build/**/*.ipa

