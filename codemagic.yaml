workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      groups:
        - apple_credentials
    scripts:
      - name: Bypass preinstall restriction and install
        script: |
          cd /Users/builder/clone
          # تعديل ملف package.json وحذف سكربت preinstall الذي يرفض أي أداة غير pnpm
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.scripts && pkg.scripts.preinstall) {
              delete pkg.scripts.preinstall;
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
              console.log("Successfully removed preinstall script constraint.");
            }
          '
          # استخدام pnpm كما يحبذ المشروع ولكن بعد إزالة القيود المعترضة
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install
      - name: Build web assets
        script: |
          cd /Users/builder/clone
          pnpm run app:build
      - name: Sync Capacitor iOS
        script: |
          cd /Users/builder/clone
          npx cap sync ios
    artifacts:
      - "**/ios/App/App/build/**/*.ipa"






































