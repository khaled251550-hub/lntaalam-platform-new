workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    working_directory: clone
    environment:
      groups:
        - apple_credentials
    scripts:
      - name: Force install with npm
        script: |
          rm -rf node_modules yarn.lock package-lock.json pnpm-lock.yaml .yarn
          npm install --legacy-peer-deps --force
      - name: Build web assets
        script: npm run app:build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
    artifacts:
      - ios/App/App/build/**/*.ipa










